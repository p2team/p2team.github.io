- date: 24. October 2025
  headline: Bernardo Malaca wins Best PhD thesis award.
  fullstory: Former P2-team member Bernardo Malaca, now HPC SysAdmin at [Centro Nacional de Computação Avançada](https://acnca.pt/) (Portugal), has received the award for the Best PhD Thesis in Optics and Photonics in Portugal, 2024, sponsored by the Portuguese Society for Optics and Photonics – [SPOF](https://www.optica.pt). The thesis, entitled ["Superradiant and coherent radiation emission in plasma accelerator light sources”](https://scholar.tecnico.ulisboa.pt/api/records/a22rIMG8JFRQts9awmibPoiQVxLGrwiI61DZ/file/ec057998227b98c81946b1a6f1ce43694e8084107d1a60534ad923a3b5fdc374.pdf) was supervised by Jorge Vieira and Ricardo Fonseca. In his thesis, Bernardo pioneered a light source concept that leverages collective effects to unlock superradiance and coherent emission in plasma-based accelerators. This work was was published in [Nature Photonics](https://www.nature.com/articles/s41566-023-01311-z). Congratulations Bernardo!
  number_photo: 1
  photo: Bernardo_v2.jpg

