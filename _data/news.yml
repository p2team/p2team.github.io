- date: 13. July 2025
  headline: Our team hosted the [EuPRAXIA-DN Training Camp II Science](https://agenda.infn.it/event/46472/) between 13-15 July at IST.
  fullstory: The second EuPRAXIA-Doctoral Network training camp was held at IST during July 13-15 2025. The camp included talks on advanced accelerator technologies, and discussed next-generation light sources. The camp also included talks by EuPRAXIA-DN fellow and P2-team member BT (nonlinear Thomson scattering), by CB (muon acceleration using laser pulses with a flying focus), RA (Thomson scattering using structured light), and a poster by CW (magnetic field generation and photon deceleration from azimuthally polarised beams) and XW (Zernike polynomial mode expansion in PIC codes). [GoLP](http://golp.ist.utl.pt) members RF, MV, and DL gave talks about HPC for plasma accelerators, direct laser acceleration, and machine-learning optimized laser plasma accelerators. Our collaborator [Marco Piccardo](https://mplab.tecnico.ulisboa.pt) also presented a talk on meta-surfaces for structured light. 
  number_photo: 1
  photo: EuPRAXIA-DN-IST.jpg
  photo_caption: EuPRAXIA-DN Camp II Science group photo.

- date: 23. May 2025
  headline: Our structured-light review paper is out on [Optica](https://doi.org/10.1364/OPTICA.558754).
  fullstory: P2 team member JV is a co-author of a [review](https://doi.org/10.1364/OPTICA.558754) article about structured light in laser-plasma interactions at ultra-high intensity, and its various applications from plasma-based accelerators, their light sources and magnetic field generation to strong field quantum-electro-dynamics (QED).
  number_photo: 1
  photo: Optica-review-2025.jpg
  photo_caption: Construction of an OAM beam from a minimalistic definition of structured light. (a) Interference of three plane waves with differ- ent k wave vectors and phases leading to a lattice with a vortex phase. (b) Extension to the case of 20 plane waves, resulting in a well-defined donut beam carrying OAM. Taken from our paper [here](https://doi.org/10.1364/OPTICA.558754).

- date: 14. May 2025
  headline: Jorge Vieira gave a Seminar at the Center of Physics and Engineering of Advanced Materials [(CeFEMA)](https://cefema.tecnico.ulisboa.pt/people/joao-seixas/).
  fullstory: The talk was an overview of plasma-based accelerators and their light sources, the challenges for high energy physics, and also new oportunities using structured light pulses (e.g., with orbital angular momentum and with a flying focus), and our recent work on radiation from [quasiparticles](https://www.nature.com/articles/s41566-023-01311-z).
