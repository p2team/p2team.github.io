- date: 3. July 2026
  headline: News and Views article about generation of relativistically intense light springs.
  fullstory: How do you twist light without losing its structure when it is focused to extreme intensities? A new [News & Views article in Nature Photonics by [Jorge Vieira](https://www.linkedin.com/in/jorge-vieira-9144aa30/) discusses a remarkable advance - the first experimental generation of light springs at relativistic laser intensities. Unlike conventional optical vortices, light springs combine spatial and temporal structure into a helical intensity pattern that survives tight focusing. This provides a powerful new way of controlling the angular momentum and spatio-temporal properties of ultra-intense laser pulses. Why is this exciting? Because structured light at relativistic intensities opens the door to previously unexplored laser-plasma interactions, with potential applications in particle acceleration, compact radiation sources, high-field physics and ultrafast science. The article offers an accessible overview of the physics behind this breakthrough and explains why it represents an important step towards a new generation of structured ultra-intense laser experiments. The paper can be found [here](https://www.nature.com/articles/s41566-026-01947-7) and [here](https://rdcu.be/frJzA).
  number_photo: 1
  photo: news-and-views.jpg

- date: 9. June 2026
  headline: Chiara Badiali defended her PhD thesis.
  fullstory: P2-team member Chiara Badiali defended her PhD thesis entitled **Circumventing dephasing and pump-depletion for long and stable single-stage plasma acceleration - from flying focus laser pulses to proton bunch drivers**. The thesis was co-supervised by Dr. Thales Silva. The juri of her thesis included Prof. Robert Bingham (STFC/University of Strathclyde, UK), Prof. Massimo Ferrario (INFN, Italy) and Prof. Luís Silva (IST). Many congratulations to Chiara!
