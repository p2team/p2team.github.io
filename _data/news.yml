- date: 24. October 2025
  headline: Bernardo Malaca wins Best PhD thesis award.
  fullstory: Former P2-team member Bernardo Malaca, now HPC SysAdmin at [Centro Nacional de Computação Avançada](https://rnca.fccn.pt/en/) (Portugal), has received the award for the Best PhD Thesis in Optics and Photonics in Portugal, 2020, sponsored by the Portuguese Society for Optics and Photonics – [(]SPOF](https://www.optica.pt). The thesis, entitled ["Superradiant and coherent radiation emission in plasma accelerator light sources”](https://scholar.tecnico.ulisboa.pt/api/records/a22rIMG8JFRQts9awmibPoiQVxLGrwiI61DZ/file/ec057998227b98c81946b1a6f1ce43694e8084107d1a60534ad923a3b5fdc374.pdf) was supervised by Jorge Vieira and Ricardo Fonseca. In his thesis, Bernardo pioneered a light source concept that leverages collective effects to unlock superradiance and coherent emission in plasma-based accelerators. This work was was published in [Nature Photonics](https://www.nature.com/articles/s41566-023-01311-z). Congratulations Bernardo!
  number_photo: 1
  photo: Bernardo_v2.jpg

- date: 3. October 2025
  headline: Camilla Willim defended her PhD thesis.
  fullstory: P2-team member Camilla Willim defended her PhD thesis entitled **Structured laser-plasma interactions at ultra-high intensities**. The thesis was co-supervised by Prof. Luís Silva. The juri of her thesis included Prof. Marija Vranic (IST), Prof. John Palastro (University of Rochester and Laboratory for Laser Energetics) and Prof. João Jorge Santos (University of Bordeaux). Many congratulations to Camilla!
  number_photo: 1
  photo: PhD-Camilla.png
  photo_caption: (left) From left to right - Frederico Fiuza; Marija Vranic; Camilla Willim, Jorge Vieira, John Palastro, João Santos. (right) Camilla with her PhD hat.

- date: 18. July 2025
  headline: Dr. Raoul Trines ([RAL](https://www.ukri.org/who-we-are/stfc/facilities/rutherford-appleton-laboratory/)/STFC) visited our team and [GoLP](https://golp.tecnico.ulisboa.pt) .
  fullstory: Our team and [GoLP](https://golp.tecnico.ulisboa.pt) hosted the visit of Dr. Raoul Trines between 16-17 July. In addition to several discussions, Raoul delivered a GoLP-VIP Seminar entitled "Laser high-harmonic generation in plasma:the new beat wave" where he shared some of hist recent exciting theoretical approach to high harmonics generation.
  number_photo: 0

- date: 13. July 2025
  headline: Our team hosted the [EuPRAXIA-DN Training Camp II Science](https://agenda.infn.it/event/46472/) between 13-15 July at IST.
  fullstory: The second EuPRAXIA-Doctoral Network training camp was held at IST during July 13-15 2025. The camp included talks on advanced accelerator technologies, and discussed next-generation light sources. The camp also included talks by EuPRAXIA-DN fellow and P2-team member BT (nonlinear Thomson scattering), by CB (muon acceleration using laser pulses with a flying focus), RA (Thomson scattering using structured light), and a poster by CW (magnetic field generation and photon deceleration from azimuthally polarised beams) and XW (Zernike polynomial mode expansion in PIC codes). [GoLP](http://golp.ist.utl.pt) members RF, MV, and DL gave talks about HPC for plasma accelerators, direct laser acceleration, and machine-learning optimized laser plasma accelerators. Our collaborator [Marco Piccardo](https://mplab.tecnico.ulisboa.pt) also presented a talk on meta-surfaces for structured light. 
  number_photo: 1
  photo: EuPRAXIA-DN-IST.jpg
  photo_caption: EuPRAXIA-DN Camp II Science group photo.

- date: 23. May 2025
  headline: Our structured-light review paper is out on [Optica](https://doi.org/10.1364/OPTICA.558754).
  fullstory: P2 team member JV is a co-author of a [review](https://doi.org/10.1364/OPTICA.558754) article about structured light in laser-plasma interactions at ultra-high intensity, and its various applications from plasma-based accelerators, their light sources and magnetic field generation to strong field quantum-electro-dynamics (QED).
  number_photo: 1
  photo: Optica-review-2025.jpg
  photo_caption: Construction of an OAM beam from a minimalistic definition of structured light. (a) Interference of three plane waves with differ- ent k wave vectors and phases leading to a lattice with a vortex phase. (b) Extension to the case of 20 plane waves, resulting in a well-defined donut beam carrying OAM. Taken from our paper [here](https://doi.org/10.1364/OPTICA.558754).

- date: 14. May 2025
  headline: Jorge Vieira gave a Seminar at the Center of Physics and Engineering of Advanced Materials [(CeFEMA)](https://cefema.tecnico.ulisboa.pt/people/joao-seixas/).
  fullstory: The talk was an overview of plasma-based accelerators and their light sources, the challenges for high energy physics, and also new oportunities using structured light pulses (e.g., with orbital angular momentum and with a flying focus), and our recent work on radiation from [quasiparticles](https://www.nature.com/articles/s41566-023-01311-z).
  number_photo: 0

- date: 12. May 2025
  headline: Our paper on propagation-invariant optical pulses is out on [Optics Letters](https://doi.org/10.1364/OL.562773).
  fullstory: Propagation-invariant optical pulses have a peak intensity that travels at an arbitrary, tunable velocity while maintaining their spatiotemporal profile. We have shown that their structure is universal, thereby combining a plethora of previously disconnected descriptions. These pulses may be used in processes where phase-locking and an accurate control of the velocity of radiation intensity is key.
  number_photo: 1
  photo: Opt-Lett-Almeida-2025.jpg
  photo_caption: Even though the whole envelope of the electromagnetic field travels at c, the focus, i.e., the peak intensity moves at a constant velocity v<sub>f</sub> that can be arbitrarily chosen.

- date: 9. May 2025
  headline: Jorge Vieira gave a Seminar at the EuPRAXIA Virtual Seminar Series.
  fullstory: The [seminar](https://agenda.infn.it/event/45900/page/10216-achieving-superradiant-plasma-accelerator-based-light-sources-with-collective-effects) focused on the recent [quasiparticle light source concept](https://www.nature.com/articles/s41566-023-01311-z) (which may bring temporal coherence and superradiance to plasma accelerator-based light sources). This was the first seminar of the [EuPRAXIA Virtual Seminar Series](https://agenda.infn.it/event/45900/) and is available on [youtube](https://www.youtube.com/watch?v=sskvIQSR_EY)
  number_photo: 0

