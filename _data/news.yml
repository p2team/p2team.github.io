- date: 26. April 2026
  headline: The article [Tailored laser wakefield acceleration for decaying particles](https://doi.org/10.1103/1pp8-qx35) is out in Physical Review Research.  
  fullstory: P2-team member Chiara Badiali is the leading author of this paper that shows, with theory and PIC simulations using Osiris, that spacetime wave-packets with a flying focus combined with a suitably tailored axial plasma density profile can drive a laser wakefield accelerator suitable to accelerate particles with short life-times (e.g., muons, kaons, pions) to relativistic energies before decaying. This work shows that a flying focus laser-driver can excite a nearly non-evolving plasma wave in an uniform plasma, moving with a constant phase-velocity set by laser focal velocity. A laser with a sub-luminal focal plane is ideal to trap these particles in the plasma. The acceleration can then be prolongued beyond the usual dephasing length by tailoing the plasma density. 
  number_photo: 1
  photo: muons.png
  photo_caption: Illustration of a flying focus laser pulse (red and blue) driving a plasma Wakefield (white), in which a muon particle beam (green) is trapped and accelerated.

- date: 3. March 2026
  headline: Our paper [Plasma Rotation driven by lasers with zero angular momentum](https://doi.org/10.1017/S0022377825101062) is out in Journal of Plasma Physics.  
  fullstory: P2-team alumnus Camilla Willim is the first author of this paper. The paper shows, with theory and PIC simulations in Osiris, that azimuthaly polarised lasers can drive a mechanical rotation of the plasma, once laser frequency downshifts become significant during propagation. Because lasers with azimuthal polarisation carry zero angular momentum, we found that the angular momentum carried by the plasma is compensated by the angular momentum carried by the self-consistently generated electric and magnetic fields in plasma. Our results then show that the laser polarisation can be used as a knob to control the motion of mater, at relativistic intensities. This control can benefit applications related to plasma accelerators and light sources. Click [here](https://www.linkedin.com/feed/update/urn:li:activity:7434263000821284865/?originTrackingId=3VEhw%2F3wv0Q8JHhgN1ndvw%3D%3D) for additional info. 
  number_photo: 1
  photo: plasma-rotation.png

