- date: 14. January 2026
  headline: Our Letter on [superradiant scattering from evanescent waves](https://doi.org/10.1103/PhysRevResearch.8.L012013) is out in Physical Review Research.
  fullstory: P2-team alumnus Miguel Pardal is the first author of this work, which explores the radiation emitted by relativistic electrons scattering from evanescent waves at the interface between vacuum and a solid plasma slab. The study shows that the electrons can emit an ultra-short replica of the evanescent wave. Furthermore, it demonstrates the onset of [generalized superradiance](https://doi.org/10.1038/s41567-020-0995-5) when the electron beam is appropriately modulated.  
  number_photo: 1
  photo: evanescent.png

